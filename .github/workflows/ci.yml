---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate, lint and security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Install system tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck vagrant

      - name: Install RuboCop
        run: gem install rubocop --no-document

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.0"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Run full check gate
        run: make STRICT=1 check
