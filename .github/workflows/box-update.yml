---
name: Vagrant box update

# Dependabot does not support Vagrant Cloud, so this workflow keeps the pinned
# box version in vagrant/config/default.yaml current with reviewed PRs.

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-box:
    name: Check for a newer VirtualBox box
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Update pinned box version when needed
        run: python scripts/check-box-update.py --update

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/vagrant-box-update
          title: "deps(vagrant): update pinned box version"
          body: |
            Automated update of the pinned Vagrant box to the latest release
            that still publishes a VirtualBox provider.

            Generated by scripts/check-box-update.py. CI validates the change.
          commit-message: "deps(vagrant): update pinned box version"
          labels: dependencies, vagrant
