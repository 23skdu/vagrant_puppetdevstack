---
# RuboCop profile focused on correctness and security, not cosmetic churn.
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  Exclude:
    - "vendor/**/*"
    - ".vagrant/**/*"

Layout/LineLength:
  Max: 120

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Security/YAMLLoad:
  Enabled: true
  Description: "Require YAML.safe_load instead of YAML.load/load_file."
