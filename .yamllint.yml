---
extends: default

rules:
  document-start:
    present: true
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent

ignore: |
  .vagrant/
  .venv/
  vagrant/secrets/
